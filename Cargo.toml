[workspace]
resolver = "2"
members = [
    "contracts/lending-pool",
    "contracts/collateral-vault",
    "contracts/liquidation-engine",
    "contracts/oracle-manager",
    "contracts/interest-rate-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LumenLend Protocol"]
license = "MIT"
repository = "https://github.com/lumenlend/lumenlend"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
